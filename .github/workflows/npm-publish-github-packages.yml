# OrchidPay fail-closed release protection, until a signed and approved publication manifest exists.
# This is a CI safeguard, not an approval to publish any package or mobile app.
name: OrchidPay Package Publication Lock
on:
  release:
    types: [created, published]
permissions:
  contents: read
jobs:
  publish-blocked:
    name: No GitHub Packages or npm publication without separately approved release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse all implicit package publishing
        shell: bash
        run: |
          set -euo pipefail
          echo 'ORCHIDPAY_PACKAGE_PUBLICATION=NO_GO'
          echo 'AUTHORIZATION=EXACT_BINARY_AND_SIGNED_RELEASE_GATE_REQUIRED'
          echo 'LIVE_PAYMENTS_SETTLEMENT_PAYOUT=OFF'
          exit 1
